<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blurSoft" />
      <feMerge>
        <feMergeNode in="blurSoft" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(99, 102, 241, 0.2)" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 14s ease-in-out infinite alternate;
      }
      .retention-pulse {
        animation: pulseLine 4s ease-in-out infinite;
      }
      .pill-float-1 {
        animation: floatY1 6s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: floatY2 7s ease-in-out infinite alternate;
      }
      .particle-stream {
        stroke-dasharray: 8 16;
        animation: flowDash 20s linear infinite;
      }
      .metric-beacon {
        animation: radarPing 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(80px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-70px, -30px) scale(1.2); }
      }
      @keyframes floatY1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatY2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes pulseLine {
        0%, 100% { opacity: 0.45; stroke-width: 2.5; }
        50% { opacity: 0.9; stroke-width: 3.5; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes radarPing {
        0% { r: 5; opacity: 0.9; }
        100% { r: 24; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Ambient Orbs in Background -->
  <g filter="url(#glowSoft)">
    <circle class="glow-orb-1" cx="220" cy="110" r="160" fill="#6366f1" opacity="0.18" />
    <circle class="glow-orb-2" cx="1020" cy="300" r="180" fill="#ec4899" opacity="0.16" />
    <circle class="glow-orb-1" cx="880" cy="90" r="130" fill="#06b6d4" opacity="0.14" />
  </g>

  <!-- Dynamic Animated Graph & Metric Flow Curves (Layered in Midground Behind Text) -->
  <g opacity="0.75">
    <!-- Base Graph Grid Lines -->
    <line x1="80" y1="360" x2="1120" y2="360" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <line x1="80" y1="300" x2="1120" y2="300" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 6" />
    <line x1="80" y1="240" x2="1120" y2="240" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 6" />

    <!-- Flowing Stream Data Line -->
    <path class="particle-stream" d="M 60 350 Q 250 320 420 280 T 800 180 T 1140 120" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.6" />

    <!-- Surging Retention Curve -->
    <path class="retention-pulse" filter="url(#glow)" d="M 60 360 C 220 350, 380 320, 560 260 C 740 200, 920 130, 1140 100" fill="none" stroke="url(#accentGrad)" />

    <!-- Shaded Area Under Retention Curve -->
    <path d="M 60 360 C 220 350, 380 320, 560 260 C 740 200, 920 130, 1140 100 L 1140 360 L 60 360 Z" fill="url(#accentGrad)" opacity="0.06" />

    <!-- Radar Beacon at High-Retention Milestone -->
    <circle cx="1050" cy="115" class="metric-beacon" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="1050" cy="115" r="5" fill="#10b981" filter="url(#glow)" />
    
    <circle cx="560" cy="260" r="4.5" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="820" cy="170" r="4.5" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Floating Dynamic Feature Badges/Pills (Midground) -->
  <g class="pill-float-1" transform="translate(900, 48)">
    <rect width="210" height="40" rx="20" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <circle cx="22" cy="20" r="6" fill="#10b981" />
    <text x="38" y="25" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">NET RETENTION 125%</text>
  </g>

  <g class="pill-float-2" transform="translate(70, 48)">
    <rect width="180" height="38" rx="19" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#6366f1" />
    <text x="34" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">AI HEALTH SCORING</text>
  </g>

  <!-- FOREGROUND: High-Contrast Permanent Banner Content -->
  <!-- Top Category Kicker -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="0" y="0" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM</text>
  </g>

  <!-- Primary Title with High-Contrast Gradient Fill and Drop Shadow -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
    Awesome Churn Prevention
  </text>
  <text x="600" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="url(#accentGrad)" filter="url(#glow)">
    &amp; Customer Retention
  </text>

  <!-- Clear Foreground Subtitle / Tagline -->
  <text x="600" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Top SaaS Suites, Customer Health Scoring, Churn Prediction ML &amp; Proactive Win-Back Workflows
  </text>

  <!-- Bottom Dynamic Metrics Bar -->
  <g transform="translate(600, 375)" text-anchor="middle">
    <text x="-260" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <tspan fill="#38bdf8">10+</tspan> Commercial SaaS Platforms
    </text>
    <circle cx="-110" cy="-4" r="2.5" fill="#475569" />
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <tspan fill="#a855f7">10+</tspan> Open-Source ML Models
    </text>
    <circle cx="110" cy="-4" r="2.5" fill="#475569" />
    <text x="260" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <tspan fill="#34d399">100%</tspan> Battle-Tested Playbooks
    </text>
  </g>
</svg>
